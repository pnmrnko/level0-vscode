  <rect width="128" height="128" rx="24" fill="#1f5f3b"/>
  <!-- a way through three nodes, the shape of Level0L data -->
  <path d="M28 96 L54 50 L100 32" fill="none" stroke="#e8f3ec" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="28" cy="96" r="12" fill="#f2c14e"/>
  <circle cx="54" cy="50" r="12" fill="#f2c14e"/>
  <circle cx="100" cy="32" r="12" fill="#f2c14e"/>
  <!-- tag lines under the way -->
  <rect x="68" y="72" width="34" height="8" rx="4" fill="#e8f3ec"/>
  <rect x="68" y="88" width="24" height="8" rx="4" fill="#e8f3ec" opacity="0.7"/>
</svg>
